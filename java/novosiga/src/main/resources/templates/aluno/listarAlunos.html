<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Alunos</title>
</head>
<body>
    <h1 style="text-align: center;">Fomulário Aluno</h1>
    <h2 style="text-align: center;"><a href="/alunos/criar">Cadastrar Aluno</a></h2>

    <table align="center" border="1">
        <tr>
            <th colspan="10">Lista de Alunos</th>
        </tr>    
        <tr>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Cidade</th>
            <th>Estado</th>
            <th>CEP</th>
            <th>Telefone</th>
            <th>CPF</th>
            <th>Curso</th>
            <th>Foto</th>
            <th colspan="2">Ações</th>
        </tr>
        <tr th:each="aluno : ${alunos}">
            <td th:text="${aluno.nomeAluno}"></td>
            <td th:text="${aluno.enderecoAluno}"></td>
            <td th:text="${aluno.cidadeAluno}"></td>
            <td th:text="${aluno.estadoAluno}"></td>
            <td th:text="${aluno.cepAluno}"></td>
            <td th:text="${aluno.telefoneAluno}"></td>
            <td th:text="${aluno.cpfAluno}"></td>
            <td th:text="${aluno.curso.nomeCurso}"></td>
            <td>
                <img th:if="${aluno.fotoAluno != null}"
                     th:src="@{/alunos/foto/{id}(id=${aluno.idAluno})}"
                     width="60" height="70">
            </td>
            <td>
                <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}">Editar</a>
                <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}">Excluir</a>
            </td>
        </tr>
    </table>
</body>
</html>
