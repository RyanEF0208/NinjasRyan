<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Cursos</title>
</head>
<body>
    <h1 style="text-align: center;">Fomulário Cursos</h1>
    <h2 style="text-align: center;"><a href="/cursos/criar">Cadastrar Curso</a></h2>

    <table align="center" border="1">
        <tr>
            <th colspan="10">Lista de Cursos</th>
        </tr>    
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Carga Horária</th>
            <th colspan="2">Ações</th>
        </tr>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.nomeCurso}"></td>
            <td th:text="${curso.descricaoCurso}"></td>
            <td th:text="${curso.cargaHoraria}"></td>
            <td>
                <a th:href="@{/cursos/editar/{id}(id=${curso.idCurso})}">Editar</a>
                <a th:href="@{/cursos/excluir/{id}(id=${curso.idCurso})}">Excluir</a>
            </td>
        </tr>
    </table>
</body>
</html>
