spring.application.name=novosiga

#Definir o banco de dados para a conexao
spring.datasource.url=jdbc:postgresql://localhost:5432/db_novosiga
spring.datasource.username=postgres
spring.datasource.password=1234

# Configuracoes de JPA/Hibernate

# Atuliza o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

# Limpar o cache para a execucao do Thymeleaf
spring.thymeleaf.cache=false

# Exibir no terminal o SQL sendo executado
spring.jpa.show-sql=true

# Limitar tamanho máximo aod arquivo enviado para 2Mb
# Por arquivo
spring.servlet.multipart.max-file-size=2MB
# Por requisição (juntando os arquivos de cada campo)
spring.servlet.multipart.max-request-size=2MB